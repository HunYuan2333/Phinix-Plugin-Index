name: Theme catalog publication
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate only, without publishing
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: theme-catalog-writer
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-validator
      - name: Validate exact reviewed theme input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/theme_publication.py --validator Validator/bin/Release/net10.0/Validator.dll --check-only
  publish:
    needs: validate
    if: inputs.check_only == false && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-validator
        with:
          regression-tests: 'false'
      - name: Revalidate and publish separate theme pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/theme_publication.py --validator Validator/bin/Release/net10.0/Validator.dll
