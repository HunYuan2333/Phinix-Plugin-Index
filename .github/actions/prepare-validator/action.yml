name: Prepare trusted static validator
description: Build only checked-out trusted sources; never execute candidate assemblies
inputs:
  regression-tests:
    description: Run the repository regression suite
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x
    - shell: bash
      run: dotnet build Validator/Validator.csproj --configuration Release
    - if: inputs.regression-tests == 'true'
      shell: bash
      run: python3 -m unittest discover -s tests -v
